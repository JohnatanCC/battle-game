<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trono Caído</title>
    <meta name="description" content="Arena 16-bit: um ser divino exilado ascende das profundezas para reconquistar seu trono." />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0814; overflow: hidden; }
      /* Cenário ampliado e escurecido atrás do jogo (preenche as laterais em telas ultrawide) */
      #backdrop {
        position: fixed; inset: -2%;
        background-color: #0b0814;
        background-size: cover; background-position: center;
        image-rendering: pixelated;
        filter: brightness(0.6) saturate(0.9);
        transition: opacity 0.5s;
      }
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(11, 8, 20, 0) 45%, rgba(11, 8, 20, 0.7) 100%);
      }
      /* O Phaser centraliza o canvas dentro deste contêiner */
      #game { position: fixed; inset: 0; }
      canvas {
        image-rendering: pixelated; image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #2a1f45, 0 0 60px rgba(0, 0, 0, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="vignette"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
